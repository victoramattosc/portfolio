<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Victor Carbelotti — Dev Full-stack</title>
    <meta name="description" content="Portfólio de Victor Carbelotti: desenvolvedor full-stack, técnico de TI e designer. Projetos, experiência e contato." />
    <meta name="theme-color" content="#16131c" />
    <meta property="og:title" content="Victor Carbelotti — Dev Full-stack" />
    <meta property="og:description" content="Portfólio de desenvolvimento full-stack, TI e design." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <script>
      // Evita flash de tema/cor errados antes do React montar.
      try {
        var s = JSON.parse(localStorage.getItem('va-portfolio') || '{}');
        var r = document.documentElement;
        r.dataset.theme = s.theme || 'dark';
        r.dataset.color = s.color || 'lavanda';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
